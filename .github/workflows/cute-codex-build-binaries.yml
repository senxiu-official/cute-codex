# cute-codex: build the native files (codex-app-server, codex, codex-code-mode-host, codex-exec-server + the
# app-server protocol schema) for Linux x64 and Windows x64 and keep them as workflow artifacts.
# Nothing is published from here and no signing key is in CI: the owner downloads the artifacts
# (`gh run download`), signs them offline with minisign and uploads them to the GitHub Release.
# Separate from the upstream Codex workflows: it runs only for cute-codex-v* tags or by hand.
name: cute-codex build binaries

on:
  push:
    tags: ["cute-codex-v*"]
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Exact public product source to build (empty = dispatched ref)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: cute-codex-build-binaries-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: natives ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    # A local Windows build takes about an hour on a desktop machine; GitHub's 4-core runners are slower.
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04: glibc 2.35, so the binaries also run on older distributions than the newest runner.
          - platform: linux-x64
            runner: ubuntu-22.04
            leak_policy: fail
            rust_toolchain: "1.99.1"
          - platform: windows-x64
            runner: windows-2022
            leak_policy: warn
            rust_toolchain: "1.95.0"
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.rust_toolchain }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep LF line endings (the runtime embeds SQL migrations hashed byte for byte)
        run: git config --global core.autocrlf false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.source_ref || github.ref }}
          persist-credentials: false
      - name: Free disk space, add swap, fewer parallel jobs (Linux)
        # The 16 GB runner ran out of memory and lost contact with GitHub during the release build
        # (thin LTO + line tables of the V8-linked binaries): up to 24 GB swap and at most 3 rustc jobs
        # at a time. Runners differ: the 16 GB one has a separate /mnt disk; the 7 GB one (private
        # repositories) has /mnt on the root disk, where a 24 GB swap file left the build 7 GB and it
        # ran out of space. So: swap where there is room (the build needs about 40 GB of the workspace
        # disk), and 2 jobs on a small runner.
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/local/lib/node_modules /usr/share/swift /usr/local/.ghcup \
            /opt/microsoft /opt/google /usr/local/share/powershell /usr/local/share/chromium
          sudo docker image prune -af > /dev/null 2>&1 || true
          sudo swapoff -a || true
          avail_gb() { df -BG --output=avail "$1" | tail -1 | tr -dc 0-9; }
          if [ "$(df --output=source /mnt | tail -1)" != "$(df --output=source . | tail -1)" ]; then
            swap_dir=/mnt; swap_gb=$(( $(avail_gb /mnt) - 2 ))
          else
            swap_dir=/; swap_gb=$(( $(avail_gb .) - 40 ))
          fi
          [ "$swap_gb" -gt 24 ] && swap_gb=24
          if [ "$swap_gb" -ge 4 ]; then
            sudo fallocate -l "${swap_gb}G" "$swap_dir/cute-codex.swap"
            sudo chmod 600 "$swap_dir/cute-codex.swap"
            sudo mkswap "$swap_dir/cute-codex.swap"
            sudo swapon "$swap_dir/cute-codex.swap"
          fi
          mem_gb=$(free -g | awk '/^Mem:/ {print $2}')
          if [ "$mem_gb" -lt 12 ]; then echo "CARGO_BUILD_JOBS=2" >> "$GITHUB_ENV"; else echo "CARGO_BUILD_JOBS=3" >> "$GITHUB_ENV"; fi
          echo "swap ${swap_gb} GB in $swap_dir, memory ${mem_gb} GB"
          free -g
          df -h . /mnt
      - name: Build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            pkg-config libssl-dev libcap-dev liblzma-dev libbz2-dev libzstd-dev zlib1g-dev
      - name: Rust toolchain (native release matrix)
        working-directory: codex-rs
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component clippy --component rustfmt --component rust-src && rustc --version
      - name: Short Cargo paths and CLI Git on Windows
        if: runner.os == 'Windows'
        run: |
          git config --global core.longpaths true
          {
            echo "CARGO_TARGET_DIR=C:\\cute-codex-target"
            echo "CARGO_HOME=C:/c"
            echo "CARGO_NET_GIT_FETCH_WITH_CLI=true"
          } >> "$GITHUB_ENV"
      - name: Build and pack
        env:
          LEAK_POLICY: ${{ matrix.leak_policy }}
          V8_DIR: ${{ runner.temp }}/v8
        run: bash .github/cute-codex/build-natives.sh "${{ matrix.platform }}" "$RUNNER_TEMP/out"
      - name: Verify and encrypt same-run private Windows symbols
        if: runner.os == 'Windows'
        run: |
          set -euo pipefail
          symbols="$RUNNER_TEMP/private-native-symbols"
          mkdir -p "$symbols"
          python .github/cute-codex/pdb-identity.py --bin-dir "$CARGO_TARGET_DIR/release" --out "$symbols/PDB-MATCH.json"
          cp "$CARGO_TARGET_DIR/release/"{codex,codex_app_server,codex_code_mode_host,codex_exec_server}.pdb "$symbols/"
          gpg_home="$RUNNER_TEMP/symbol-encryption"
          mkdir -m 700 "$gpg_home"
          gpg --homedir "$gpg_home" --batch --import .github/cute-codex/symbol-retention.pub
          recipient="$(gpg --homedir "$gpg_home" --batch --with-colons --list-keys | awk -F: '$1 == "fpr" {print $10; exit}')"
          test -n "$recipient"
          tar -C "$symbols" -cf - . | gpg --homedir "$gpg_home" --batch --trust-model always --recipient "$recipient" --encrypt --output "$RUNNER_TEMP/native-private-symbols.tar.gpg"
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: runner.os == 'Windows'
        with:
          name: encrypted-native-private-symbols-windows-x64
          path: ${{ runner.temp }}/native-private-symbols.tar.gpg
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: natives-${{ matrix.platform }}
          path: ${{ runner.temp }}/out/
          if-no-files-found: error
          retention-days: 30

  sums:
    name: SHA256SUMS
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          pattern: natives-*
      - name: Check and combine the per-platform sums
        run: |
          set -euo pipefail
          mkdir out
          for d in artifacts/natives-*; do
            (cd "$d" && sha256sum --check SHA256SUMS-*)
            cat "$d"/SHA256SUMS-* >> out/SHA256SUMS
          done
          sort -k2 -o out/SHA256SUMS out/SHA256SUMS
          cat out/SHA256SUMS
          {
            echo '### cute-codex natives'
            echo '```'
            cat out/SHA256SUMS
            echo '```'
            echo 'Unsigned: the owner signs these offline (minisign) before they are attached to a release.'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: SHA256SUMS
          path: out/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
